# 3D Prints Portal
#
# Usage:
#   cp .env.example .env    # then fill in real values
#   docker compose up -d
#
# The prints folder is mounted read-only; the app never writes to it.
# Everything the app stores (database, sessions, thumbnails, invoices) lives in
# the named volume "data".
#
# Every setting below comes from .env; an empty value counts as unset, so you only
# fill in what you use.

services:
  prints-portal:
    image: ghcr.io/makreeltje/prints-portal:latest
    build: .
    container_name: prints-portal
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080'
    volumes:
      - '${PRINTS_ROOT:?Set PRINTS_ROOT in .env to the folder that holds your customer folders}:/prints:ro'
      - data:/data
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Default: SQLite on the data volume. Alternatives:
      #   postgres://user:password@host:5432/prints_portal
      #   mysql://user:password@host:3306/prints_portal   (MariaDB too)
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/prints-portal.db}

      # Indexing (defaults shown). Set WATCH_POLLING to true if file changes are not picked up.
      # INDEX_ON_STARTUP: 'true'
      # WATCH_ENABLED: 'true'
      # WATCH_DEBOUNCE_MS: '2000'
      # WATCH_POLLING: 'false'

      # Sign-in. SESSION_SECRET is required; ADMIN_* create the first Admin (local login).
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -base64 48)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Public address without a path (OIDC redirects and Deel-link URLs).
      PUBLIC_URL: ${PUBLIC_URL:-}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-}
      RATE_LIMIT_SHARE: ${RATE_LIMIT_SHARE:-}

      # Spoolman (optional; leave empty to hide Spoolman features)
      SPOOLMAN_URL: ${SPOOLMAN_URL:-}
      SPOOLMAN_TIMEOUT_MS: ${SPOOLMAN_TIMEOUT_MS:-}
      # Electricity tariff in €/kWh, used only on the first start
      ELECTRICITY_TARIFF_EUR_PER_KWH: ${ELECTRICITY_TARIFF_EUR_PER_KWH:-}

      # OIDC, e.g. Authentik (optional; local login is disabled when all four are set;
      # PUBLIC_URL is then required).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-}

      # Reverse proxy: only these addresses may set X-Forwarded-* headers
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Other origins that may call the API with cookies (rarely needed)
      CORS_ORIGINS: ${CORS_ORIGINS:-}

volumes:
  data:
